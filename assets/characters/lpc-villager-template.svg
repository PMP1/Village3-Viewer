<svg xmlns="http://www.w3.org/2000/svg" width="576" height="256" viewBox="0 0 576 256" shape-rendering="crispEdges">
  <defs>
    <!-- Marker colours are deliberately replaced by character-renderer.js after rasterisation. -->
    <!-- skin-light #ff00ff, skin-shadow #aa00aa, tunic-light #00ffff, tunic-shadow #008888, -->
    <!-- hair #ffff00, trousers #0000ff, belt #aa5500. Constant dark pixels remain unchanged. -->

    <g id="south-neutral">
      <rect x="20" y="57" width="24" height="3" fill="#000000" opacity="0.22"/>
      <rect x="25" y="44" width="6" height="13" fill="#0000ff"/><rect x="34" y="44" width="6" height="13" fill="#0000ff"/>
      <rect x="23" y="55" width="9" height="4" fill="#333333"/><rect x="33" y="55" width="9" height="4" fill="#333333"/>
      <rect x="19" y="31" width="26" height="15" fill="#008888"/><rect x="22" y="29" width="20" height="15" fill="#00ffff"/>
      <rect x="18" y="33" width="5" height="12" fill="#aa00aa"/><rect x="42" y="33" width="5" height="12" fill="#aa00aa"/>
      <rect x="19" y="33" width="4" height="9" fill="#ff00ff"/><rect x="42" y="33" width="4" height="9" fill="#ff00ff"/>
      <rect x="20" y="43" width="24" height="4" fill="#aa5500"/><rect x="31" y="43" width="3" height="4" fill="#f1d08a"/>
      <rect x="23" y="13" width="18" height="18" fill="#aa00aa"/><rect x="24" y="12" width="16" height="17" fill="#ff00ff"/>
      <rect x="23" y="10" width="18" height="7" fill="#ffff00"/><rect x="22" y="14" width="4" height="9" fill="#ffff00"/><rect x="39" y="14" width="4" height="9" fill="#ffff00"/>
      <rect x="27" y="20" width="2" height="2" fill="#302821"/><rect x="35" y="20" width="2" height="2" fill="#302821"/><rect x="31" y="25" width="4" height="1" fill="#7d473f"/>
    </g>
    <g id="south-stride-a">
      <rect x="20" y="57" width="24" height="3" fill="#000000" opacity="0.22"/>
      <rect x="22" y="44" width="6" height="13" fill="#0000ff"/><rect x="37" y="44" width="6" height="13" fill="#0000ff"/>
      <rect x="20" y="55" width="9" height="4" fill="#333333"/><rect x="36" y="55" width="9" height="4" fill="#333333"/>
      <rect x="19" y="31" width="26" height="15" fill="#008888"/><rect x="22" y="29" width="20" height="15" fill="#00ffff"/>
      <rect x="17" y="34" width="5" height="12" fill="#aa00aa"/><rect x="43" y="31" width="5" height="12" fill="#aa00aa"/>
      <rect x="18" y="34" width="4" height="9" fill="#ff00ff"/><rect x="43" y="31" width="4" height="9" fill="#ff00ff"/>
      <rect x="20" y="43" width="24" height="4" fill="#aa5500"/><rect x="31" y="43" width="3" height="4" fill="#f1d08a"/>
      <rect x="23" y="14" width="18" height="18" fill="#aa00aa"/><rect x="24" y="13" width="16" height="17" fill="#ff00ff"/>
      <rect x="23" y="11" width="18" height="7" fill="#ffff00"/><rect x="22" y="15" width="4" height="9" fill="#ffff00"/><rect x="39" y="15" width="4" height="9" fill="#ffff00"/>
      <rect x="27" y="21" width="2" height="2" fill="#302821"/><rect x="35" y="21" width="2" height="2" fill="#302821"/><rect x="31" y="26" width="4" height="1" fill="#7d473f"/>
    </g>
    <g id="south-stride-b">
      <rect x="20" y="57" width="24" height="3" fill="#000000" opacity="0.22"/>
      <rect x="28" y="44" width="6" height="13" fill="#0000ff"/><rect x="31" y="44" width="6" height="13" fill="#0000ff"/>
      <rect x="27" y="55" width="9" height="4" fill="#333333"/><rect x="29" y="55" width="9" height="4" fill="#333333"/>
      <rect x="19" y="31" width="26" height="15" fill="#008888"/><rect x="22" y="29" width="20" height="15" fill="#00ffff"/>
      <rect x="18" y="31" width="5" height="12" fill="#aa00aa"/><rect x="42" y="34" width="5" height="12" fill="#aa00aa"/>
      <rect x="19" y="31" width="4" height="9" fill="#ff00ff"/><rect x="42" y="34" width="4" height="9" fill="#ff00ff"/>
      <rect x="20" y="43" width="24" height="4" fill="#aa5500"/><rect x="31" y="43" width="3" height="4" fill="#f1d08a"/>
      <rect x="23" y="14" width="18" height="18" fill="#aa00aa"/><rect x="24" y="13" width="16" height="17" fill="#ff00ff"/>
      <rect x="23" y="11" width="18" height="7" fill="#ffff00"/><rect x="22" y="15" width="4" height="9" fill="#ffff00"/><rect x="39" y="15" width="4" height="9" fill="#ffff00"/>
      <rect x="27" y="21" width="2" height="2" fill="#302821"/><rect x="35" y="21" width="2" height="2" fill="#302821"/><rect x="31" y="26" width="4" height="1" fill="#7d473f"/>
    </g>

    <g id="north-neutral">
      <use href="#south-neutral"/>
      <rect x="23" y="10" width="19" height="16" fill="#ffff00"/><rect x="22" y="14" width="4" height="12" fill="#ffff00"/><rect x="39" y="14" width="4" height="12" fill="#ffff00"/>
    </g>
    <g id="north-stride-a"><use href="#south-stride-a"/><rect x="23" y="11" width="19" height="16" fill="#ffff00"/><rect x="22" y="15" width="4" height="12" fill="#ffff00"/><rect x="39" y="15" width="4" height="12" fill="#ffff00"/></g>
    <g id="north-stride-b"><use href="#south-stride-b"/><rect x="23" y="11" width="19" height="16" fill="#ffff00"/><rect x="22" y="15" width="4" height="12" fill="#ffff00"/><rect x="39" y="15" width="4" height="12" fill="#ffff00"/></g>

    <g id="west-neutral">
      <use href="#south-neutral"/>
      <rect x="23" y="10" width="18" height="7" fill="#ffff00"/><rect x="22" y="14" width="5" height="11" fill="#ffff00"/>
      <rect x="35" y="20" width="2" height="2" fill="#ff00ff"/><rect x="26" y="20" width="2" height="2" fill="#302821"/><rect x="23" y="22" width="2" height="3" fill="#aa00aa"/>
    </g>
    <g id="west-stride-a"><use href="#south-stride-a"/><rect x="23" y="11" width="18" height="7" fill="#ffff00"/><rect x="22" y="15" width="5" height="11" fill="#ffff00"/><rect x="35" y="21" width="2" height="2" fill="#ff00ff"/><rect x="26" y="21" width="2" height="2" fill="#302821"/><rect x="23" y="23" width="2" height="3" fill="#aa00aa"/></g>
    <g id="west-stride-b"><use href="#south-stride-b"/><rect x="23" y="11" width="18" height="7" fill="#ffff00"/><rect x="22" y="15" width="5" height="11" fill="#ffff00"/><rect x="35" y="21" width="2" height="2" fill="#ff00ff"/><rect x="26" y="21" width="2" height="2" fill="#302821"/><rect x="23" y="23" width="2" height="3" fill="#aa00aa"/></g>

    <g id="east-neutral">
      <use href="#south-neutral"/>
      <rect x="23" y="10" width="18" height="7" fill="#ffff00"/><rect x="38" y="14" width="5" height="11" fill="#ffff00"/>
      <rect x="27" y="20" width="2" height="2" fill="#ff00ff"/><rect x="36" y="20" width="2" height="2" fill="#302821"/><rect x="40" y="22" width="2" height="3" fill="#aa00aa"/>
    </g>
    <g id="east-stride-a"><use href="#south-stride-a"/><rect x="23" y="11" width="18" height="7" fill="#ffff00"/><rect x="38" y="15" width="5" height="11" fill="#ffff00"/><rect x="27" y="21" width="2" height="2" fill="#ff00ff"/><rect x="36" y="21" width="2" height="2" fill="#302821"/><rect x="40" y="23" width="2" height="3" fill="#aa00aa"/></g>
    <g id="east-stride-b"><use href="#south-stride-b"/><rect x="23" y="11" width="18" height="7" fill="#ffff00"/><rect x="38" y="15" width="5" height="11" fill="#ffff00"/><rect x="27" y="21" width="2" height="2" fill="#ff00ff"/><rect x="36" y="21" width="2" height="2" fill="#302821"/><rect x="40" y="23" width="2" height="3" fill="#aa00aa"/></g>
  </defs>

  <!-- LPC row order: north/up, west/left, south/down, east/right. -->
  <g transform="translate(0 0)"><use href="#north-neutral"/></g><g transform="translate(64 0)"><use href="#north-stride-a"/></g><g transform="translate(128 0)"><use href="#north-neutral"/></g><g transform="translate(192 0)"><use href="#north-stride-b"/></g><g transform="translate(256 0)"><use href="#north-neutral"/></g><g transform="translate(320 0)"><use href="#north-stride-a"/></g><g transform="translate(384 0)"><use href="#north-neutral"/></g><g transform="translate(448 0)"><use href="#north-stride-b"/></g><g transform="translate(512 0)"><use href="#north-neutral"/></g>
  <g transform="translate(0 64)"><use href="#west-neutral"/></g><g transform="translate(64 64)"><use href="#west-stride-a"/></g><g transform="translate(128 64)"><use href="#west-neutral"/></g><g transform="translate(192 64)"><use href="#west-stride-b"/></g><g transform="translate(256 64)"><use href="#west-neutral"/></g><g transform="translate(320 64)"><use href="#west-stride-a"/></g><g transform="translate(384 64)"><use href="#west-neutral"/></g><g transform="translate(448 64)"><use href="#west-stride-b"/></g><g transform="translate(512 64)"><use href="#west-neutral"/></g>
  <g transform="translate(0 128)"><use href="#south-neutral"/></g><g transform="translate(64 128)"><use href="#south-stride-a"/></g><g transform="translate(128 128)"><use href="#south-neutral"/></g><g transform="translate(192 128)"><use href="#south-stride-b"/></g><g transform="translate(256 128)"><use href="#south-neutral"/></g><g transform="translate(320 128)"><use href="#south-stride-a"/></g><g transform="translate(384 128)"><use href="#south-neutral"/></g><g transform="translate(448 128)"><use href="#south-stride-b"/></g><g transform="translate(512 128)"><use href="#south-neutral"/></g>
  <g transform="translate(0 192)"><use href="#east-neutral"/></g><g transform="translate(64 192)"><use href="#east-stride-a"/></g><g transform="translate(128 192)"><use href="#east-neutral"/></g><g transform="translate(192 192)"><use href="#east-stride-b"/></g><g transform="translate(256 192)"><use href="#east-neutral"/></g><g transform="translate(320 192)"><use href="#east-stride-a"/></g><g transform="translate(384 192)"><use href="#east-neutral"/></g><g transform="translate(448 192)"><use href="#east-stride-b"/></g><g transform="translate(512 192)"><use href="#east-neutral"/></g>
</svg>
