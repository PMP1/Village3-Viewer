<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Village Simulation Viewer</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-width: 320px; background: #0d1117; }
        button, select, input { font: inherit; }
        button, select {
            min-height: 40px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #161b22;
            color: #e6edf3;
            padding: 0 12px;
        }
        button:hover:not(:disabled) { background: #21262d; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
        button[aria-pressed="true"] { background: #1f6feb; border-color: #388bfd; }
        .shell { padding: 16px; max-width: 1640px; margin: 0 auto; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }
        .time { font-weight: 700; min-width: 170px; }
        .spacer { flex: 1; }
        .speed-group { display: flex; gap: 6px; }
        .timeline-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin-bottom: 14px; }
        .timeline-row input { width: 100%; }
        .layout {
            display: grid;
            grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) minmax(280px, 360px);
            gap: 14px;
            align-items: start;
        }
        .panel { border: 1px solid #30363d; border-radius: 10px; background: #0d1117; overflow: hidden; }
        .panel-heading { padding: 10px 12px; border-bottom: 1px solid #30363d; background: #161b22; font-weight: 650; }
        .heading-row { display: flex; align-items: center; gap: 8px; }
        .heading-row button { margin-left: auto; min-height: 30px; padding: 0 9px; font-size: 12px; }
        .people-list { max-height: min(72vh, 760px); overflow: auto; }
        .person-card {
            width: 100%;
            min-height: 0;
            border: 0;
            border-radius: 0;
            border-bottom: 1px solid #21262d;
            padding: 10px;
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 10px;
            text-align: left;
            background: #0d1117;
        }
        .person-card:last-child { border-bottom: 0; }
        .person-card[aria-pressed="true"] { background: #172033; box-shadow: inset 3px 0 #58a6ff; }
        .person-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 1px solid #3d444d;
            background: #21262d;
            color: #f0f6fc;
            font-weight: 750;
            letter-spacing: 0.02em;
        }
        .person-details { min-width: 0; display: grid; gap: 6px; }
        .person-name { font-size: 14px; line-height: 1.1; }
        .person-stats { display: grid; gap: 3px; }
        .person-stat { display: grid; grid-template-columns: 45px minmax(46px, 1fr) 24px; gap: 5px; align-items: center; }
        .person-stat-label, .person-stat-value { font-size: 10px; color: #8b949e; }
        .person-stat-value { text-align: right; font-variant-numeric: tabular-nums; }
        .person-stat-track { height: 6px; border-radius: 999px; overflow: hidden; background: #21262d; }
        .person-stat-fill { display: block; height: 100%; background: #58a6ff; border-radius: inherit; }
        .person-goal, .person-action { font-size: 11px; color: #c9d1d9; line-height: 1.3; overflow-wrap: anywhere; }
        .person-detail-label { color: #8b949e; font-weight: 650; margin-right: 3px; }
        .map-wrap { position: relative; background: #090d12; }
        #map {
            width: 100%;
            height: min(72vh, 760px);
            min-height: 520px;
            display: block;
            touch-action: none;
            cursor: grab;
        }
        #map.dragging { cursor: grabbing; }
        .map-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: calc(100% - 20px);
        }
        .map-controls button {
            min-height: 34px;
            padding: 0 10px;
            background: rgba(22, 27, 34, 0.92);
            backdrop-filter: blur(4px);
        }
        .map-note {
            position: absolute;
            left: 10px;
            bottom: 8px;
            font-size: 12px;
            color: #8b949e;
            pointer-events: none;
            background: rgba(9, 13, 18, 0.72);
            border-radius: 5px;
            padding: 3px 6px;
        }
        .inspector { padding: 12px; }
        .inspector h2 { font-size: 18px; margin: 0 0 4px; }
        .inspector .meta { color: #8b949e; margin-bottom: 10px; font-size: 13px; }
        .kv { display: grid; grid-template-columns: minmax(95px, auto) 1fr; gap: 5px 10px; font-size: 13px; }
        .kv dt { color: #8b949e; }
        .kv dd { margin: 0; overflow-wrap: anywhere; }
        .events-panel { margin-top: 14px; }
        .event-heading { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .event-filter-status { margin-left: auto; color: #8b949e; font-size: 12px; font-weight: 500; }
        .events { height: 340px; overflow: auto; }
        .event { padding: 9px 12px; border-bottom: 1px solid #21262d; font-size: 14px; line-height: 1.35; }
        .event-time { color: #8b949e; font-size: 12px; margin-bottom: 2px; }
        .empty { color: #8b949e; padding: 14px 12px; }
        .status { color: #8b949e; font-size: 13px; margin-left: auto; }
        @media (max-width: 1180px) {
            .layout { grid-template-columns: 260px minmax(0, 1fr); }
            .inspector-panel { grid-column: 1 / -1; }
            .people-list { max-height: 620px; }
        }
        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            .inspector-panel { grid-column: auto; }
            .people-list { max-height: 430px; }
            #map { height: 62vh; min-height: 460px; }
            .events { height: 300px; }
            .spacer { display: none; }
            .status { width: 100%; margin-left: 0; }
        }
        @media (max-width: 520px) {
            .shell { padding: 10px; }
            .toolbar { gap: 7px; }
            .time { width: 100%; }
            .timeline-row { grid-template-columns: 1fr auto; }
            .timeline-row input { grid-column: 1 / -1; grid-row: 2; }
            #map { height: 60vh; min-height: 420px; }
            button, select { min-height: 44px; }
            .map-controls button { min-height: 40px; }
            .person-card { grid-template-columns: 40px minmax(0, 1fr); }
            .person-avatar { width: 38px; height: 38px; }
            .event-filter-status { width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="toolbar" aria-label="Playback controls">
            <div id="time" class="time">Loading simulation…</div>
            <button id="restart" type="button">Restart</button>
            <button id="back" type="button" aria-label="Step back one tick">−1 tick</button>
            <button id="play" type="button" aria-pressed="false">Play</button>
            <button id="forward" type="button" aria-label="Step forward one tick">+1 tick</button>
            <div class="spacer"></div>
            <div class="speed-group" aria-label="Playback speed">
                <button type="button" data-speed="1" aria-pressed="true">1×</button>
                <button type="button" data-speed="5" aria-pressed="false">5×</button>
                <button type="button" data-speed="20" aria-pressed="false">20×</button>
            </div>
            <div id="status" class="status" aria-live="polite"></div>
        </div>

        <div class="timeline-row">
            <span>Tick <strong id="tick">0</strong></span>
            <input id="timeline" type="range" min="0" max="0" value="0" step="1" aria-label="Simulation timeline">
            <span id="duration">0 / 0</span>
        </div>

        <div class="layout">
            <section class="panel people-panel" aria-label="People">
                <div class="panel-heading heading-row">
                    <span>People</span>
                    <button id="show-all-events" type="button" disabled>All events</button>
                </div>
                <div id="people-list" class="people-list" aria-label="Character list"></div>
            </section>

            <section class="panel" aria-label="Simulation map">
                <div class="panel-heading">World view</div>
                <div class="map-wrap">
                    <canvas id="map" tabindex="0" aria-label="Simulation map. Select an entity by clicking it. Drag to pan and scroll or pinch to zoom."></canvas>
                    <div class="map-controls" aria-label="Map camera controls">
                        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
                        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
                        <button id="fit-world" type="button">Fit village</button>
                        <button id="follow-selected" type="button" aria-pressed="false" disabled>Follow selected</button>
                    </div>
                    <div class="map-note">Drag to pan · scroll/pinch to zoom · choose a person to focus and filter</div>
                </div>
            </section>

            <section class="panel inspector-panel">
                <div class="panel-heading">Selected entity</div>
                <div id="inspector" class="inspector">
                    <div class="empty">Select a character, place, or object on the map.</div>
                </div>
            </section>
        </div>

        <section class="panel events-panel">
            <div class="panel-heading event-heading">
                <span>Events</span>
                <span id="event-filter-status" class="event-filter-status" aria-live="polite">All characters</span>
            </div>
            <div id="events" class="events" aria-live="polite"></div>
        </section>
    </div>

    <script src="./viewer.js"></script>
    <script src="./character-debug.js"></script>
    <script src="./map-features.js"></script>
    <script src="./building-walls.js"></script>
    <script src="./tile-renderer.js"></script>
    <script src="./tile-atlas.js"></script>
    <script src="./building-atlas.js"></script>
    <script src="./game-shell.js"></script>
    <script src="./character-renderer.js"></script>
</body>
</html>
